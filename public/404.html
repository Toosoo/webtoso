<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — webtoso</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f0d0e" />
  <!--
    Self-contained: this file is copied verbatim and unhashed, so it cannot link
    the hub's hashed stylesheet. Colours below are hand-copied from
    src/styles/hub.css and nothing syncs them.

    Bilingual because one file answers every bad URL in both locales.
  -->
  <style>
    :root {
      --canvas: #0f0d0e;
      --surface: #1a1617;
      --ink: #f9f4da;
      --muted: #a39c93;
      --accent: #ff5436;
      --hairline: rgb(255 255 255 / 0.14);
    }

    /* The real faces are hashed woff2 files this page cannot @font-face. */
    :root {
      --font-sans: "Inter Variable", "Cairo Variable", ui-sans-serif, system-ui,
        -apple-system, "Segoe UI", sans-serif;
      --font-display: "Space Grotesk Variable", var(--font-sans);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1rem;
    }

    @media (min-width: 40rem) {
      body {
        padding: 3.5rem 2rem;
      }
    }

    .shell {
      width: 100%;
      max-width: 46rem;
      margin-inline: auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 0.875rem;
      height: 0.875rem;
      background: var(--accent);
      flex: none;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .code {
      font-family: var(--font-display);
      font-size: clamp(4.5rem, 18vw, 8rem);
      line-height: 0.85;
      font-weight: 700;
      letter-spacing: -0.045em;
      margin: 0;
    }

    .rule {
      height: 4px;
      width: 100%;
      background: var(--ink);
      margin-top: 1.25rem;
    }

    .panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      margin-top: 2rem;
      background: var(--hairline);
      border: 1px solid var(--hairline);
    }

    @media (min-width: 40rem) {
      .panel {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* The 1px grid gap shows the container through as the divider — no
       direction-aware border to flip under RTL. */
    .locale {
      background: var(--surface);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .message {
      margin: 0;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: color-mix(in srgb, var(--ink) 85%, var(--surface));
    }

    .links {
      list-style: none;
      margin: 0.25rem 0 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      padding: 0.375rem 0.75rem;
      border: 1px solid var(--hairline);
      background: var(--canvas);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: border-color 0.15s ease, background-color 0.15s ease,
        color 0.15s ease;
    }

    .links a:hover {
      border-color: var(--ink);
    }

    .links a.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--canvas);
    }

    .links a.primary:hover {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--canvas);
    }

    .brand:focus-visible,
    .links a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="shell">
    <a class="brand" href="/" aria-label="webtoso">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">webtoso</span>
    </a>
  </div>

  <main class="shell">
    <h1 class="code" dir="ltr">404</h1>
    <div class="rule" aria-hidden="true"></div>

    <div class="panel">
      <section class="locale" lang="ar" dir="rtl">
        <p class="label">عذرًا</p>
        <p class="message">الصفحة دي مش موجودة. يمكن الرابط اتغيّر، أو فيه غلطة في العنوان.</p>
        <ul class="links">
          <li><a class="primary" href="/ar/">الرئيسية</a></li>
          <li><a href="/ar/threejs/">three.js</a></li>
          <li><a href="/ar/gsap/">GSAP</a></li>
          <li><a href="/ar/lab/">أمثلة</a></li>
        </ul>
      </section>

      <section class="locale" lang="en" dir="ltr">
        <p class="label">Not found</p>
        <p class="message">This page doesn't exist. The link may have changed, or the address has a typo.</p>
        <ul class="links">
          <li><a class="primary" href="/en/">Home</a></li>
          <li><a href="/en/threejs/">three.js</a></li>
          <li><a href="/en/gsap/">GSAP</a></li>
          <li><a href="/en/lab/">Lab</a></li>
        </ul>
      </section>
    </div>
  </main>
</body>

</html>
